spring.application.name=esports-tournaments

# Conexión a PostgreSQL - Saca los datos de las variables de entorno en .env
spring.config.import=optional:file:.env[.properties]
# ${NOMBRE:valor} -> usa la variable NOMBRE; si no existe, usa el valor tras los ":"
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/esports_db}
spring.datasource.username=${DB_USERNAME:postgres}
# Sin valor por defecto a propósito: si falta, la app no arranca y avisa
spring.datasource.password=${DB_PASSWORD}

#Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.open-in-view=false
